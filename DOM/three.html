<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Part-3</title>
</head>
<body style="background-color: black; color: aliceblue;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>

    function addLanguages(topa){
        const li = document.createElement("li");
        const list = document.querySelector("ul");
        const addText = document.createTextNode(topa)
        li.appendChild(addText);
        list.appendChild(li)
    }
   
   addLanguages("Python")
   addLanguages("C++")
   addLanguages("DSA")
</script>
</html>
