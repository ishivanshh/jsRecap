    // same function but optimized function : dont use innerhtml do offen u can use appendchild.

    function addOptiLanguage(langName){
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(langName));
        document.querySelector(".language").appendChild(li);
    }
    addOptiLanguage("golang")
    addOptiLanguage("html")


    // edit any child use replace with
    const firstlanguag = document.querySelector("li:nth-child(2)")

    firstlanguag.replaceWith(newLi);
